name: CI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  build-psp:
    name: PSP Build
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apk add build-base git bash cmake python3
        git clone https://github.com/mcidclan/psp-media-engine-custom-core.git /tmp/me-core
        git -C /tmp/me-core checkout f153f0de12d42377b4f7ecec7e328dd2f0e825bb
        psp-cmake -S /tmp/me-core -B /tmp/me-core-build
        cmake --build /tmp/me-core-build -j2
        cmake --install /tmp/me-core-build
    
    - name: Compile project
      run: |
        ./build_daedalus.sh PSP

    - name: Audit ME graphics and audio instructions
      run: python3 Tools/tests/check_me_graphics.py build/Source/daedalus --audio

    - name: Test audio RAM publication and PCM streaming
      run: |
        g++ -std=c++23 -O2 -pthread -ISource Tools/tests/test_me_audio.cpp -o /tmp/test_me_audio
        /tmp/test_me_audio

    - name: Get short SHA
      id: slug
      run: echo "{name}={sha8::$(echo ${GITHUB_S9A} | cut -c1-8)}" >> $GITHUB_OUTPUT

    - name: Prepare Artifacts
      run: |
        rm -rf DaedalusX64/daedalus.prx # Remove the PRX used for testing in public builds

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: DaedalusX64-PSP
        path: DaedalusX64

    - name: Extract tag name
      if: startsWith(github.ref, 'refs/tags/')
      id: tag
      run: echo "{name}={VERSION::${GITHUB_REF/refs\/tags\//}}" >> $GITHUB_OUTPUT


  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install build-essential git bash cmake libpng-dev libz-dev libminizip-dev libsdl2-dev libsdl2-ttf-dev libglew-dev libglm-dev
    
    - name: Compile project
      run: |
        ./build_daedalus.sh

    - name: Get short SHA
      id: slug
      run: echo "{name}={sha8::$(echo ${GITHUB_SHA} | cut -c1-8)}" >> $GITHUB_OUTPUT

    - name: Prepare artifacts
      run: |
        tar -zcvf daedalusX64-linux-amd64.tar.gz DaedalusX64


    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: DaedalusX64-Linux-amd64
        path: DaedalusX64

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install build-essential git bash cmake libpng-dev libz-dev libminizip-dev libsdl2-dev libsdl2-ttf-dev libglew-dev libfmt-dev libglm-dev
    
    - name: Compile project
      run: |
        ./build_daedalus.sh

    - name: Get short SHA
      id: slug
      run: echo "{name}={sha8::$(echo ${GITHUB_SHA} | cut -c1-8)}" >> $GITHUB_OUTPUT

    - name: Prepare artifacts
      run: |
        tar -zcvf daedalusX64-linux-arm64.tar.gz DaedalusX64

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: DaedalusX64-Linux-arm64
        path: DaedalusX64


  build-ctr:
    runs-on: ubuntu-24.04
    container: wally4000/daedalusx64:latest

    steps:
      - uses: actions/checkout@v4 

      - name: Compile project
        run: | 
          ./build_daedalus.sh CTR

      - name: Get short SHA
        id: slug
        run: echo "{name}={sha8::$(echo ${GITHUB_SHA} | cut -c1-8)}" >> $GITHUB_OUTPUT

      - name: Prepare artifacts
        run: |
          tar -zcvf daedalusX64-CTR.tar.gz DaedalusX64\

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: DaedalusX64-CTR
          path: DaedalusX64

  build-macos:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Homebrew # This will install the correct homebrew for architecture selected
      run: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    - name: Install dependencies
      run: |
        brew install git bash cmake libpng minizip sdl2 sdl2_ttf glew glm
    
    - name: Compile project
      run: |
        ./build_daedalus.sh

    - name: Get short SHA
      id: slug
      run: echo "{name}={sha8::$(echo ${GITHUB_SHA} | cut -c1-8)}" >> $GITHUB_OUTPUT

    - name: Prepare artifacts
      run: |
          tar -zcvf daedalusX64-macos-x86.tar.gz DaedalusX64

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: DaedalusX64-macos
        path: DaedalusX64

  build-windows:
    # runs-on: windows-latest
    runs-on: ubuntu-24.04
    container: wally4000/daedalus-win:latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          ./build_daedalus.sh WIN

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: DaedalusX64-Win
          path: DaedalusX64
